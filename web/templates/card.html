<article class="project-card" data-project="$name" data-scenes="$scenes" data-platforms="$platforms" data-form="$form" data-search="$search" data-initial="$initial">
<div class="card-top"><div class="project-icon hue-$hue" aria-hidden="true">$initials</div><div class="project-heading"><h3><a href="$detail">$displayName</a></h3><p class="repository-name">$name</p></div><button type="button" class="save-button" data-save="$name" aria-label="收藏 $displayName" aria-pressed="false" hidden>☆</button></div>
<div class="card-tags">$tags</div><p class="project-purpose">$purpose</p>
<dl class="decision-facts"><div><dt>适合谁</dt><dd>$audience</dd></div><div><dt>设备</dt><dd>$devices</dd></div><div><dt>需要准备</dt><dd>$prerequisites</dd></div></dl>
<details class="recommendation-proof"><summary>推荐依据</summary><p>$reason</p><p>$reviewLabel · $checked</p><a href="$detail#evidence">查看官方资料与限制 →</a></details>
<div class="card-bottom"><a class="button official-link" href="$official" rel="noopener noreferrer" target="_blank">$pathLabel <span aria-hidden="true">↗</span></a><a class="detail-link" href="$detail">了解详情 <span aria-hidden="true">→</span></a></div>
</article>
