<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitRadar · 中文 GitHub 爆款雷达</title>
<style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#e9eef8;background:#0a1020}*{box-sizing:border-box}body{margin:0}a{color:#9ecbff;text-decoration:none}header{background:linear-gradient(130deg,#172c57,#101b32 60%,#123f43);padding:40px max(22px,calc((100vw - 1100px)/2));border-bottom:1px solid #29415e}h1{font-size:clamp(26px,4vw,42px);margin:0 0 10px}.sub{color:#b8c8dc;line-height:1.8}.badge{color:#80e6bc;font-size:13px;letter-spacing:2px;font-weight:700}main{max-width:1100px;margin:auto;padding:24px 20px 80px}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}button,input,select{border:1px solid #354963;border-radius:10px;padding:11px 15px;background:#15243b;color:#e9eef8;font-size:14px}button{cursor:pointer}button.active,button:hover{background:#245a79;border-color:#56add0}input{flex:1;min-width:190px}.meta{color:#a4b6cb;font-size:13px;line-height:1.7;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}.card{background:#131e31;border:1px solid #2c3c55;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:11px}.card:hover{border-color:#5a8fae}.top{display:flex;justify-content:space-between;align-items:start;gap:10px}.name{font-size:19px;font-weight:750;overflow-wrap:anywhere}.pill{font-size:12px;background:#25405b;border-radius:20px;padding:5px 9px;white-space:nowrap}.desc{color:#d3deeb;line-height:1.7;min-height:52px}.original{font-size:12px;color:#8297b2;line-height:1.5}.stats{display:flex;flex-wrap:wrap;gap:13px;color:#b5c9de;font-size:13px}.growth{color:#80e6bc}.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:10px}.empty{padding:48px 20px;text-align:center;border:1px dashed #4b5e76;border-radius:16px;color:#c6d3e4}.notice{padding:14px 16px;border:1px solid #465576;background:#18253c;border-radius:12px;margin-bottom:18px;color:#c6d7e8;line-height:1.7;font-size:13px}.small{font-size:12px;color:#8fa7c1}footer{color:#8fa7c1;margin-top:30px;line-height:1.8;font-size:13px}
</style></head><body>
<header><div class="badge">GITRADAR · 开源发现实验室</div><h1>🔥 中文 GitHub 爆款雷达</h1><div class="sub">不只看大项目，更关注最近冒头的有趣开源工具。<br>全领域探索 · 中文速读 · 直接跳转原项目</div></header>
<main><div class="bar" id="tabs"><button class="active" data-tab="hot">🔥 最近热门</button><button data-tab="new">💎 新晋黑马</button><button data-tab="tools">🛠 实用工具</button><button data-tab="ai">🤖 AI 项目</button><button data-tab="saved">⭐ 我的收藏</button></div>
<div class="bar"><input id="search" placeholder="搜索项目名称、中文标签或英文简介"><select id="sort"><option value="stars">按 Star 数</option><option value="growth">按记录期间 Star 增量</option><option value="updated">按最近更新</option></select><button id="refresh">↻ 更新数据</button></div>
<div class="notice" id="notice">正在获取 GitHub 公开项目数据……</div><div class="meta" id="summary"></div><div class="grid" id="cards"></div>
<footer>数据来自 GitHub 公开搜索 API，属于探索型候选榜单，<b>不是 GitHub 官方 Trending 榜</b>。搜索 API 无法直接给出全站 24 小时 Star 增量；本页面仅在同一浏览器保存过历史快照时计算观测期增长。中文标签为规则生成，英文项目简介保留原文供核对。数据可能受到 API 限流和搜索结果上限影响。</footer></main>
<script>
const $=id=>document.getElementById(id), DAY=86400000, now=new Date();
const iso=d=>new Date(d).toISOString().slice(0,10);
const daysAgo=n=>iso(Date.now()-n*DAY);
const categories=[
[/adblock|ad.block|adguard|remove.ads|no.ads|smart.tv|android.tv|launcher|television|youtube|iptv/i,'📺 影音 / 去广告','电视、影音或广告处理相关工具'],
[/download|yt.dlp|video|media|music|player|stream/i,'🎬 影音下载','视频、音频或媒体处理工具'],
[/agent|llm|chatbot|openai|model|rag|diffusion|mcp|artificial.intelligence/i,'🤖 AI 工具','人工智能或大模型相关项目'],
[/privacy|security|vpn|firewall|password|blocker/i,'🔐 隐私安全','隐私保护或安全工具'],
[/productivity|automation|workflow|notion|notes|calendar|office/i,'⚡ 效率工具','自动化或效率提升工具'],
[/desktop|windows|macos|linux|android|ios|browser|extension/i,'💻 系统工具','桌面、移动端或浏览器工具'],
[/self.host|homelab|docker|nas|server/i,'🏠 自托管','可以自行部署的开源服务'],
[/game|gaming|emulator/i,'🎮 游戏娱乐','游戏或模拟器相关项目']
];
let repos=[],tab='hot', saved=new Set(JSON.parse(localStorage.getItem('radar_saved')||'[]'));
let snapshots=JSON.parse(localStorage.getItem('radar_snapshots')||'{}');
function cat(r){let s=[r.name,r.description,(r.topics||[]).join(' ')].join(' ');return categories.find(([rx])=>rx.test(s))?.slice(1)||['📦 开源项目','值得进一步探索的开源项目']}
function chinese(r){let [label,description]=cat(r);return `${description}。${r.language?'主要使用 '+r.language+' 开发。':''}`}
function growth(r){return r.delta_7d ?? null}
function card(r){let [label]=cat(r),g=growth(r),star=saved.has(r.full_name);let div=document.createElement('article');div.className='card';div.innerHTML=`<div class="top"><a class="name" href="${r.html_url}" target="_blank" rel="noopener"></a><span class="pill"></span></div><div class="desc"></div><div class="original"></div><div class="stats"><span class="stars"></span><span class="delta"></span><span class="language"></span></div><div class="foot"><span class="small"></span><button class="save"></button></div>`;
div.querySelector('.name').textContent=r.full_name;div.querySelector('.pill').textContent=label;div.querySelector('.desc').textContent=chinese(r);div.querySelector('.original').textContent=r.description?'原文：'+r.description:'项目暂无英文简介';div.querySelector('.stars').textContent='⭐ '+r.stargazers_count.toLocaleString();div.querySelector('.delta').textContent=g===null?'📈 暂无历史增量':'📈 7天 +'+g.toLocaleString();div.querySelector('.language').textContent='⌨ '+(r.language||'未标注');div.querySelector('.small').textContent='更新 '+iso(r.pushed_at);let b=div.querySelector('.save');b.textContent=star?'★ 已收藏':'☆ 收藏';b.onclick=()=>{star?saved.delete(r.full_name):saved.add(r.full_name);localStorage.setItem('radar_saved',JSON.stringify([...saved]));render()};return div}
function render(){let q=$('search').value.trim().toLowerCase(),items=repos.filter(r=>{let txt=[r.full_name,r.description,cat(r).join(' '),(r.topics||[]).join(' ')].join(' ').toLowerCase();if(q&&!txt.includes(q))return false;if(tab==='saved')return saved.has(r.full_name);if(tab==='new')return new Date(r.created_at)>Date.now()-30*DAY;if(tab==='tools')return /工具|影音|安全|效率|系统|自托管|娱乐/.test(cat(r)[0]);if(tab==='ai')return cat(r)[0].includes('AI');return true});
let s=$('sort').value;items.sort((a,b)=>s==='growth'?(growth(b)??-1)-(growth(a)??-1):s==='updated'?new Date(b.pushed_at)-new Date(a.pushed_at):b.stargazers_count-a.stargazers_count);
$('cards').replaceChildren(...items.slice(0,60).map(card));if(!items.length)$('cards').innerHTML='<div class="empty">没有匹配项目。可以更换分类或搜索词；首次打开时需要联网加载。</div>';$('summary').textContent=`当前显示 ${Math.min(items.length,60)} 个项目 · 共采集 ${repos.length} 个候选项目 · 采集时间 ${new Date().toLocaleString('zh-CN')}`}
async function fetchRepos(){try{let res=await fetch('./data/projects.json?t='+Date.now());if(!res.ok)throw Error('HTTP '+res.status);let data=await res.json();repos=data.projects||[];let at=data.generated_at?new Date(data.generated_at).toLocaleString('zh-CN'):'尚未采集';$('notice').textContent='已加载 '+repos.length+' 个候选项目 · 最近采集：'+at+'。7天增量需至少8天快照；不是全站完整榜单。';render()}catch(e){$('notice').textContent='加载失败：'+e.message+'。请到仓库 Actions 运行 Update GitRadar data。'}}
try{repos=JSON.parse(localStorage.getItem('radar_repos')||'[]')}catch{}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});
$('search').oninput=render;$('sort').onchange=render;$('refresh').onclick=fetchRepos;
if(repos.length)render();fetchRepos();
</script></body></html>
