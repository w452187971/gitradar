name: Update GitRadar data
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gitradar-update
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test collector
        run: python -m unittest discover -s tests
      - name: Test frontend
        run: node --test tests/frontend.test.cjs
      - name: Collect data and inspect README files
        id: collect
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python collect.py
      - name: Commit snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/projects.json data/history.json data/summaries.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh GitRadar snapshots'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Preserve snapshots after commit or push failure
        if: ${{ failure() && steps.collect.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: gitradar-snapshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/projects.json
            data/history.json
            data/summaries.json
          if-no-files-found: error
          retention-days: 7
